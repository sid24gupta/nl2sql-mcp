[project]
name = "nl2sql-mcp"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "faker>=40.43.0",
    "mcp[cli]>=2.3.0",
    "psycopg[binary]>=3.3.6",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]   # where pytest looks for tests
pythonpath = ["."]      # so tests can `import mcp_server` from the repo root
